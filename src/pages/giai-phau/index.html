<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#be123c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Cổng ôn tập tương tác 3D môn Giải phẫu học (Module Tiêu hóa: Dạ dày, Gan, Tụy • Module Tim mạch: Tim, Mạch máu vùng bụng) Tuyển sinh Sau đại học – Cao học Khoa học Y sinh ĐH Y Dược TP.HCM (YDS) 2026." />
  <title>Ôn Tập Giải Phẫu Học 3D SĐH 2026 - ĐH Y Dược TP.HCM (YDS)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23be123c'/%3E%3Cpath d='M32 50C20 41 14 33 14 23c0-6.2 4.8-11 10.8-11 3.5 0 6.7 1.8 7.2 4.3.5-2.5 3.7-4.3 7.2-4.3C45.2 12 50 16.8 50 23c0 10-6 18-18 27z' fill='%23ffffff'/%3E%3Cpath d='M32 16v18M24 25h16' stroke='%23be123c' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../shared/portal-nav.css" />
</head>
<body>
  <!-- LỚP PHỦ ĐÓNG DRAWER TRÊN ĐIỆN THOẠI / TABLET -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar" id="sidebar" aria-label="Danh mục 7 chuyên đề Giải phẫu học">
    <div class="sidebar-header">
      <a class="portal-sidebar-back" href="../" title="Quay về trang chủ chọn môn học">
        <span aria-hidden="true">←</span>
        <span>Trang chủ • Chọn môn học</span>
      </a>
      <div class="sidebar-header-top">
        <span class="brand-badge">Đề cương SĐH 2026 • KHYS YDS</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Đóng danh mục">✕</button>
      </div>
      <div class="sidebar-title">GIẢI PHẪU HỌC 3D</div>
      <div class="sidebar-subtitle">2 Module Đề cương (7 Bài) • 3D WebGL • Atlas • 168 Câu KSA</div>
    </div>

    <div class="overall-progress-box">
      <div class="progress-label-row">
        <span>Tiến độ trên thiết bị này</span>
        <strong id="overallProgressText">0 / 7 bài (0%)</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="overallProgressFill"></div>
      </div>
      <div class="storage-note" id="storageStatusNote">💾 Lưu tạm trên trình duyệt thiết bị này (không đồng bộ)</div>
    </div>

    <div class="sidebar-search">
      <input type="search" id="lessonSearchInput" placeholder="🔍 Tìm nhanh bài học, cấu trúc, mạch máu..." autocomplete="off" />
    </div>

    <nav class="nav-list" id="sidebarNav">
      <!-- Populated dynamically by app.js -->
    </nav>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <a class="portal-topbar-home" href="../" title="Quay về menu chọn môn học">
          <span aria-hidden="true">🏠</span>
          <span class="hide-xs">Menu môn</span>
        </a>
        <button class="menu-toggle-btn" id="menuToggleBtn" type="button" title="Mở danh mục 7 bài" aria-label="Mở danh mục bài học">☰ <span class="hide-xs">Danh mục</span></button>
        <div class="breadcrumb" id="breadcrumb">Tổng quan Đề cương Giải phẫu học Sau đại học 2026</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline topbar-btn" id="btnOverview" type="button" onclick="App.showOverview()" title="Về tổng quan 7 bài">
          <span>🧊</span> <span class="hide-sm">Đề cương 7 bài</span><span class="show-sm-only">7 bài</span>
        </button>
        <button class="btn btn-accent topbar-btn" id="btnMockExam" type="button" onclick="App.showMockExam()" title="Phòng thi thử tổng hợp">
          <span>🎯</span> <span>Thi thử</span><span class="hide-sm"> Tổng hợp</span>
        </button>
        <button class="btn btn-outline topbar-btn" id="btnThemeToggle" type="button" onclick="App.toggleTheme()" title="Đổi giao diện Sáng/Tối">🌙 <span class="hide-sm">Giao diện tối</span></button>
      </div>
    </header>

    <main class="content-container" id="mainContent">
      <!-- Dynamic view rendered here -->
    </main>
  </div>

  <!-- THANH ĐIỀU HƯỚNG NHANH CHO ĐIỆN THOẠI (MOBILE BOTTOM BAR) -->
  <nav class="mobile-bottom-bar" aria-label="Điều hướng nhanh trên di động">
    <a class="mbb-item mbb-home" href="../" title="Về trang chủ chọn môn">
      <span class="mbb-icon">🏠</span>
      <span class="mbb-label">Môn học</span>
    </a>
    <button type="button" class="mbb-item" onclick="App.openDrawer()">
      <span class="mbb-icon">☰</span>
      <span class="mbb-label">7 Bài</span>
    </button>
    <button type="button" class="mbb-item" id="mbbOverview" onclick="App.showOverview()">
      <span class="mbb-icon">🧊</span>
      <span class="mbb-label">Đề cương</span>
    </button>
    <button type="button" class="mbb-item" id="mbbMock" onclick="App.showMockExam()">
      <span class="mbb-icon">🎯</span>
      <span class="mbb-label">Thi thử</span>
    </button>
    <button type="button" class="mbb-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
      <span class="mbb-icon">⬆️</span>
      <span class="mbb-label">Đầu trang</span>
    </button>
  </nav>

  <!-- 3D Engine & Data & Logic Scripts -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="data_part1.js"></script>
  <script src="data_part2.js"></script>
  <script src="questions_extra.js"></script>
  <script src="models3d.js"></script>
  <script src="animations.js"></script>
  <script src="simulators.js"></script>
  <script src="app.js"></script>
</body>
</html>
